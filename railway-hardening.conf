# Railway terminates TLS at the edge and adds no HSTS of its own, so the app
# has to send it. Harmless on the platform's plain-HTTP health probe: browsers
# ignore Strict-Transport-Security delivered over http.
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

ServerTokens Prod
ServerSignature Off

# php:8.2-apache runs mpm_prefork with mod_php, whose stock MaxRequestWorkers of
# 150 is sized for a host, not a container: 150 × PHP's 512M ceiling is far more
# than any Railway instance has. Keep the pool small enough to fit.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         8
    MaxRequestWorkers       32
    MaxConnectionsPerChild  1000
</IfModule>

# Apache cannot infer a server name inside a container; saying so keeps
# AH00558 out of every boot log.
ServerName localhost
